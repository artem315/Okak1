name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Unzip archive if present
        run: |
          if [ -f archive.zip ]; then unzip -o archive.zip; fi

      - name: Build
        run: |
          SETTINGS=$(find . -name settings.gradle -not -path '*/.git/*' | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle не найден, файлы мода не загружены в репозиторий"
            ls -R
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: arcane-staffs
          path: '**/build/libs/*.jar'

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '**/build/libs/*.jar'
