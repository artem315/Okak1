name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

- name: schmiddim-wget-unzip
  # You may pin to the exact commit or the version.
  # uses: schmiddim/action-wget-unzip@a84af2494e90b6fbb10283b1822e6111991a56dd
  uses: schmiddim/action-wget-unzip@v2
  with:
    # url that must point to a zip file
    url: 
    # destination folder
    destination: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: |
          SETTINGS=$(find . -name settings.gradle -not -path '*/.git/*' | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle не найден. Файлы в репозитории:"
            find . -not -path './.git/*' -type f | head -50
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: arcane-staffs
          path: '**/build/libs/*.jar'

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '**/build/libs/*.jar'
